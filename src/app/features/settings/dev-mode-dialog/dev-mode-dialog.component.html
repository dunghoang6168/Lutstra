<dialog #dialog class="modal-card" role="dialog" aria-modal="true"
  aria-labelledby="devModeDialogTitle" aria-describedby="devModeDialogDescription"
  (cancel)="onCancel($event)" (keydown)="onKeyDown($event)" (click)="onBackdropClick($event)">
  <form (submit)="onSubmit($event, codeInput.value)">
    <h3 id="devModeDialogTitle">Developer mode</h3>
    <p id="devModeDialogDescription" class="modal-desc">Enter the developer code to unlock experimental tools.</p>
    <label class="code-field">
      <span class="code-label">Code</span>
      <input #codeInput class="input-box" type="text" name="code" autocomplete="off" spellcheck="false"
        [attr.aria-invalid]="wrongCode()" [attr.aria-describedby]="wrongCode() ? 'devModeDialogError' : null"
        (input)="wrongCode.set(false)" />
    </label>
    @if (wrongCode()) {
      <p id="devModeDialogError" class="code-error" role="alert">That code is not right.</p>
    }
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancel</button>
      <button type="submit" class="btn btn-primary">Unlock</button>
    </div>
  </form>
</dialog>
