<dialog #dialog class="modal-card danger" role="dialog" aria-modal="true"
  aria-labelledby="clearHistoryDialogTitle" aria-describedby="clearHistoryDialogDescription"
  [attr.aria-busy]="busy()" (cancel)="onCancel($event)" (keydown)="onKeyDown($event)"
  (click)="onBackdropClick($event)">
  <h3 id="clearHistoryDialogTitle">Clear listening history</h3>
  <p id="clearHistoryDialogDescription" class="modal-desc">
    This removes every track from the History page and everything Lutstra has learned from what you play.
    It cannot be undone.
  </p>
  @if (errorMessage(); as message) {
    <p class="remove-error" role="alert">{{ message }}</p>
  }
  <div class="modal-actions">
    <button #cancelButton type="button" class="btn-cancel" (click)="cancelled.emit()">Cancel</button>
    <button type="button" class="btn-danger" [disabled]="busy()" (click)="confirmed.emit()">Clear history</button>
  </div>
</dialog>
