<div class="reel" [class.done]="!spinning()" [attr.data-win-tier]="winTier()" [attr.aria-busy]="spinning()">
  <div class="reel-viewport" #viewport aria-hidden="true">
    <div class="reel-strip" #strip>
      @for (track of items(); track $index; let i = $index) {
        <div class="reel-cell" [attr.data-id]="track.id" [class.winner]="!spinning() && i === winnerIndex()"
          [attr.data-tier]="rarity(track)">
          <div class="reel-cover">
            @if (track.artwork) {
              <img [src]="track.artwork" alt="" loading="eager" />
            } @else {
              <app-icon name="disc" [size]="32" />
            }
          </div>
          <div class="reel-meta">
            <span class="reel-title">{{ track.title || track.fileName }}</span>
            <span class="reel-artist">{{ track.artist || 'Unknown artist' }}</span>
          </div>
        </div>
      }
    </div>
    <span class="reel-pointer"></span>
  </div>
  <app-spectrum-visualizer class="reel-spectrum" [mirrored]="true" [flipped]="true" [bare]="true" [barCount]="40" [minHz]="50" [maxHz]="23000"
    [colorVar]="spectrumColor()" [liveColor]="spectrumColor() === '--holo-live'"
    [style.visibility]="showSpectrum() ? null : 'hidden'" />
  @if (spinning()) {
    <button type="button" class="btn btn-secondary reel-skip" (click)="skip()">Skip</button>
  }
</div>
