<div class="track-row" [class.playing]="playing()" [class.unavailable]="!track().isAvailable">
  <button type="button" class="row-main" (click)="play.emit()" [disabled]="!track().isAvailable"
    [attr.aria-current]="playing() ? 'true' : null">
    @if (number() !== undefined) {
      <span class="row-number">{{ number() || '–' }}</span>
    } @else {
      <app-cover-art class="row-cover" [src]="track().artwork" icon="music" [iconSize]="20" />
    }
    <span class="row-text">
      <span class="row-title">{{ track().title }}</span>
      <span class="row-meta">
        <span class="row-artist">{{ track().isAvailable ? (track().artist ?? 'Unknown artist') : 'File unavailable' }}</span>
        @if (format(); as format) {
          <span class="row-format" [class.hires]="format.hires">{{ format.label }}</span>
        }
      </span>
    </span>
    <span class="row-time">{{ track().duration | duration }}</span>
  </button>
  <button type="button" class="row-more" (click)="openActions()" aria-haspopup="dialog"
    [attr.aria-label]="'More actions for ' + track().title">
    <app-icon name="more-horizontal" [size]="20" />
  </button>
</div>
