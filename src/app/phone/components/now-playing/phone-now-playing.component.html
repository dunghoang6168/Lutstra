<section class="now-playing phone-sheet" role="dialog" aria-modal="true" aria-label="Now Playing"
  [class.cover-tinted]="!!tone()" [style.--np-hue]="tone()?.hue" [style.--np-chroma]="tone()?.chroma"
  [attr.inert]="covered() ? '' : null" (keydown.escape)="close.emit()">
  <div class="np-ground" aria-hidden="true">
    <app-cover-art class="np-ground-art" [src]="player.currentTrack()?.artwork" [icon]="null" />
  </div>

  <header class="np-bar">
    <button #closeButton type="button" class="tonal-btn round" (click)="close.emit()" aria-label="Close Now Playing">
      <app-icon name="chevron-left" class="collapse" [size]="24" />
    </button>
    <span class="np-bar-title">Now Playing</span>
    <button #queueButton type="button" class="tonal-btn pill" (click)="openQueue.emit()" aria-haspopup="dialog" aria-label="Open queue">
      <app-icon name="queue" [size]="22" />
    </button>
  </header>

  @if (player.currentTrack(); as track) {
    <div class="np-cover-frame">
      <app-cover-art class="np-cover" appSwipe (swiped)="coverSwiped($event)" [src]="track.artwork" [iconSize]="64"
        aria-description="Swipe left for the next track, right for the previous one" />
    </div>

    <div class="np-heading">
      <div class="np-heading-text">
        <h2 class="np-title">{{ track.title }}</h2>
        <p class="np-artist">{{ track.artist ?? 'Unknown artist' }}</p>
      </div>
      <button type="button" class="tonal-btn round" (click)="library.openActions([track])" aria-haspopup="dialog"
        [attr.aria-label]="'More actions for ' + track.title">
        <app-icon name="more-horizontal" [size]="22" />
      </button>
    </div>

    <div class="np-timeline">
      <!-- A thick bar split by a thumb line, after Material 3's expressive slider; a native range input does the work. -->
      <div #seekBar class="np-seek" [class.dragging]="dragging()">
        <span class="seek-played" aria-hidden="true"></span>
        <span class="seek-rest" aria-hidden="true"></span>
        <span class="seek-head" aria-hidden="true"><span class="seek-thumb"></span></span>
        <input type="range" min="0" [max]="player.duration() || 0" step="1" [value]="position()"
          [disabled]="!player.duration()" aria-label="Seek"
          [attr.aria-valuetext]="(position() | duration) + ' of ' + (player.duration() | duration)"
          (pointerdown)="dragging.set(true)" (input)="onSeekInput($event)" (change)="onSeekCommit()"
          (pointerup)="onSeekCommit()" (pointercancel)="onSeekCommit()" />
      </div>
      <div class="np-times" [class.dragging]="dragging()">
        <span class="np-time">{{ position() | duration }}</span>
        @if (output(); as output) {
          <!-- Only what Android confirms: the path, the stream Lutstra writes and the device's rate. -->
          <button type="button" class="np-output" (click)="openAudioPath()" aria-haspopup="dialog"
            [attr.aria-label]="'Audio path: ' + output.label + (output.outBits ? ', ' + output.outBits : '') + (output.khz ? ', ' + output.khz + ' kHz' : '')">
            <span class="np-output-text">{{ output.label }}@if (output.outBits) { · <span class="measure">{{ output.outBits }}</span>}@if (output.khz) { · <span class="measure">{{ output.khz }}</span> kHz}</span>
            <app-icon name="chevron-right" [size]="14" />
          </button>
        }
        <button type="button" class="np-time np-time-end" (click)="toggleRemaining()"
          [attr.aria-label]="showRemaining() ? (remaining() | duration) + ' left. Tap to show the length' : 'Length ' + (player.duration() | duration) + '. Tap to show the time left'">
          {{ showRemaining() ? '−' + (remaining() | duration) : (player.duration() | duration) }}
        </button>
      </div>
    </div>

    <div class="np-transport" [attr.data-pressed]="pressed()">
      <button type="button" class="transport-btn prev" (click)="press('prev'); player.previous()" aria-label="Previous track">
        <app-icon name="skip-back" [size]="30" />
      </button>
      <button type="button" class="transport-btn play" [class.playing]="player.isPlaybackActive()"
        (click)="press('play'); player.togglePlayPause()" [attr.aria-label]="player.isPlaybackActive() ? 'Pause' : 'Play'">
        <app-icon [name]="player.isPlaybackActive() ? 'pause' : 'play'" [size]="34" />
      </button>
      <button type="button" class="transport-btn next" (click)="press('next'); player.next()" aria-label="Next track">
        <app-icon name="skip-forward" [size]="30" />
      </button>
    </div>

    @if (!player.modesLocked()) {
      <div class="np-toggles" role="group" aria-label="Playback modes">
        <button type="button" class="toggle" [class.on]="player.isShuffle() || player.smartShuffle()"
          [attr.aria-pressed]="player.isShuffle() || player.smartShuffle()" (click)="cycleShuffle()"
          [attr.aria-label]="shuffleLabel()">
          <app-icon [name]="player.smartShuffle() ? 'smart-shuffle' : 'shuffle'" [size]="20" />
          <span aria-hidden="true">{{ shuffleText() }}</span>
        </button>
        <!-- Smart Shuffle never runs out, so repeat does not apply while it is on. -->
        <button type="button" class="toggle repeat" [class.on]="player.repeatMode() !== 'off' && !player.smartShuffle()"
          [attr.aria-pressed]="player.repeatMode() !== 'off' && !player.smartShuffle()" [disabled]="player.smartShuffle()"
          (click)="player.cycleRepeatMode()" [attr.aria-label]="repeatLabel()">
          <app-icon [name]="player.repeatMode() === 'one' ? 'repeat-one' : 'repeat'" [size]="20" />
          <span aria-hidden="true">{{ repeatText() }}</span>
        </button>
      </div>
      @if (player.smartShuffle()) {
        <p class="np-toggle-note">Smart Shuffle keeps the music going, so repeat is off.</p>
      }
    }
  }
</section>
